<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<title>Costify – UK Contract Cost Calculator</title>

		<meta
			name="description"
			content="Costify is a free UK contract cost calculator. Compare mobile, broadband, and utility contracts by total cost, trade‑ins, cashback, and duration."
		/>
		<meta name="robots" content="index, follow" />
		<link rel="canonical" href="https://costify.info/" />

		<!-- Open Graph -->
		<meta property="og:type" content="website" />
		<meta
			property="og:title"
			content="Costify – UK Contract Cost Calculator"
		/>
		<meta
			property="og:description"
			content="Compare UK contracts by true total cost, including cashback, trade‑ins, and annual increases."
		/>
		<meta property="og:url" content="https://costify.info/" />
		<meta property="og:site_name" content="Costify" />

		<!-- Twitter -->
		<meta name="twitter:card" content="summary" />
		<meta
			name="twitter:title"
			content="Costify – UK Contract Cost Calculator"
		/>
		<meta
			name="twitter:description"
			content="Free UK contract cost calculator with comparison tools."
		/>

		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />

		<link rel="stylesheet" href="/css/styles.css" />
		<link rel="stylesheet" href="/css/index.css" />

		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
		/>
	</head>

	<body>
		<header class="site-header">
			<div class="header-inner">
				<div class="brand">
					<h1>Costify</h1>
					<p>UK contract cost calculator</p>
				</div>

				<nav class="header-actions">
					<button
						id="themeToggle"
						class="theme-toggle"
						aria-label="Toggle dark mode"
					>
						<img
							id="themeIcon"
							src="/media/icons/darkmode.svg"
							class="icon toggle"
							alt=""
							aria-hidden="true"
						/>
						<span id="themeLabel">Dark mode</span>
					</button>
				</nav>
			</div>
		</header>

		<main class="layout">
			<section class="panel calculator">
				<h2 class="section-title">
					<img
						src="/media/icons/monthlyCost.svg"
						class="icon section"
						alt=""
						aria-hidden="true"
					/>
					Calculator
				</h2>

				<label for="contractMonthlyCost">
					<img
						src="/media/icons/monthlyCost.svg"
						class="icon label"
						alt=""
						aria-hidden="true"
					/>
					Monthly cost (£)
				</label>
				<input id="contractMonthlyCost" type="number" step="0.01" />

				<label for="contractUpfrontCost">
					<img
						src="/media/icons/upfrontCost.svg"
						class="icon label"
						alt=""
						aria-hidden="true"
					/>
					Upfront cost (£)
				</label>
				<input
					id="contractUpfrontCost"
					type="number"
					step="0.01"
					value="0"
				/>

				<label for="contractIncrease">
					<img
						src="/media/icons/annualIncrease.svg"
						class="icon label"
						alt=""
						aria-hidden="true"
					/>
					Annual increase (£)
				</label>
				<input
					id="contractIncrease"
					type="number"
					step="0.01"
					value="1.5"
				/>

				<label for="contractDuration">
					<img
						src="/media/icons/duration.svg"
						class="icon label"
						alt=""
						aria-hidden="true"
					/>
					Duration (months)
				</label>
				<input
					id="contractDuration"
					type="number"
					step="1"
					value="24"
				/>

				<label for="tradeinSelected">
					<img
						src="/media/icons/tradeIn.svg"
						class="icon label"
						alt=""
						aria-hidden="true"
					/>
					Trade‑in
				</label>
				<select id="tradeinSelected">
					<option value="none">None</option>
					<option value="tradein">Yes</option>
				</select>

				<div id="tradeinMenu" class="sub-panel">
					<label for="tradeinAmount">
						<img
							src="/media/icons/tradeIn.svg"
							class="icon label"
							alt=""
							aria-hidden="true"
						/>
						Trade‑in amount (£)
					</label>
					<input
						id="tradeinAmount"
						type="number"
						step="0.01"
						value="0"
					/>
				</div>

				<label for="cashbackType">
					<img
						src="/media/icons/cashback.svg"
						class="icon label"
						alt=""
						aria-hidden="true"
					/>
					Cashback
				</label>
				<select id="cashbackType">
					<option value="none">None</option>
					<option value="bacs">Bank transfer</option>
				</select>

				<div id="cashbackMenu" class="sub-panel">
					<label for="cashbackAmount">
						<img
							src="/media/icons/cashback.svg"
							class="icon label"
							alt=""
							aria-hidden="true"
						/>
						Cashback amount (£)
					</label>
					<input
						id="cashbackAmount"
						type="number"
						step="0.01"
						value="0"
					/>
				</div>

				<button id="calculateBtn">Calculate</button>
			</section>

			<aside class="panel results">
				<h2 class="section-title">
					<img
						src="/media/icons/compare.svg"
						class="icon section"
						alt=""
						aria-hidden="true"
					/>
					Result
				</h2>

				<p id="youPayText" class="total">You pay: £0.00</p>

				<hr />

				<h3>
					<img
						src="/media/icons/save.svg"
						class="icon label"
						alt=""
						aria-hidden="true"
					/>
					Save
				</h3>

				<input
					id="calculationName"
					type="text"
					placeholder="Name this calculation"
				/>

				<div class="button-row">
					<button id="saveBtn">
						<img
							src="/media/icons/save.svg"
							class="icon button"
							alt=""
							aria-hidden="true"
						/>
						Save
					</button>
					<button id="deleteBtn" class="danger">Delete</button>
				</div>

				<select id="savedCalculationsSelect">
					<option value="">Load saved…</option>
				</select>

				<hr />

				<h3>
					<img
						src="/media/icons/compare.svg"
						class="icon label"
						alt=""
						aria-hidden="true"
					/>
					Compare
				</h3>

				<select id="compareSelect1"></select>
				<select id="compareSelect2"></select>

				<div id="comparisonResults" class="comparison-results"></div>
			</aside>
		</main>

		<footer class="site-footer">
			<div class="footer-inner">
				<p>
					© 2026 <strong>Costify</strong>.
				</p>
				<p class="footer-meta">
					Built with love by <a href="https://theohaines.company">The Theo Haines Company</a>.
				</p>
			</div>
		</footer>

		<div id="toastContainer"></div>

		<script type="module" src="/js/index.js"></script>
	</body>
</html>
