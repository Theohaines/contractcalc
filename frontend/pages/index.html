<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Costify – UK Contract Cost Calculator</title>

		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />

		<link rel="stylesheet" href="/css/styles.css" />
		<link rel="stylesheet" href="/css/index.css" />

		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
		/>

		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded"
		/>
	</head>

	<body>
		<header class="site-header">
			<div class="brand">
				<h1>Costify</h1>
				<p>UK contract cost calculator</p>
			</div>
		</header>

		<main class="layout">
			<section class="panel calculator">
				<h2>Calculator</h2>

				<label for="contractMonthlyCost">Monthly cost (£)</label>
				<input id="contractMonthlyCost" type="number" step="0.01" />

				<label for="contractUpfrontCost">Upfront cost (£)</label>
				<input
					id="contractUpfrontCost"
					type="number"
					step="0.01"
					value="0"
				/>

				<label for="contractIncrease">Annual increase (£)</label>
				<input
					id="contractIncrease"
					type="number"
					step="0.01"
					value="1.5"
				/>

				<label for="contractDuration">Duration (months)</label>
				<input
					id="contractDuration"
					type="number"
					step="1"
					value="24"
				/>

				<label for="tradeinSelected">Trade‑in</label>
				<select id="tradeinSelected">
					<option value="none">None</option>
					<option value="tradein">Yes</option>
				</select>

				<div id="tradeinMenu" class="sub-panel">
					<label for="tradeinAmount">Trade‑in amount (£)</label>
					<input
						id="tradeinAmount"
						type="number"
						step="0.01"
						value="0"
					/>
				</div>

				<label for="cashbackType">Cashback</label>
				<select id="cashbackType">
					<option value="none">None</option>
					<option value="bacs">Bank transfer</option>
				</select>

				<div id="cashbackMenu" class="sub-panel">
					<label for="cashbackAmount">Cashback amount (£)</label>
					<input
						id="cashbackAmount"
						type="number"
						step="0.01"
						value="0"
					/>
				</div>

				<button id="calculateBtn">Calculate</button>
			</section>

			<aside class="panel results">
				<h2>Result</h2>
				<p id="youPayText" class="total">You pay: £0.00</p>

				<hr />

				<h3>Save</h3>
				<input
					id="calculationName"
					type="text"
					placeholder="Name this calculation"
				/>

				<div class="button-row">
					<button id="saveBtn">Save</button>
					<button id="deleteBtn" class="danger">Delete</button>
				</div>

				<select id="savedCalculationsSelect">
					<option value="">Load saved…</option>
				</select>

				<hr />

				<h3>Compare</h3>
				<select id="compareSelect1"></select>
				<select id="compareSelect2"></select>

				<div id="comparisonResults" class="comparison-results"></div>
			</aside>
		</main>

		<div id="toastContainer"></div>

		<script type="module" src="/js/index.js"></script>
	</body>
</html>
