<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

				<p>© 2026 <strong>Costify</strong>.</p>
				<p class="footer-meta">
